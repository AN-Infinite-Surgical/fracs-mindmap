name: rebuild-map

on:
  schedule:
    # 14:20 UTC = 02:20 NZST / 03:20 NZDT. Off the hour: the top of the hour is
    # GitHub's busiest window and scheduled runs get delayed there.
    - cron: '20 14 * * 1-6'
    # Sunday is a full rebuild: editing a nested child page does not bump the
    # parent note's last_edited_time, so the incremental cache would miss it.
    - cron: '40 13 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: 'Ignore the cache and rebuild everything'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rebuild-map
  cancel-in-progress: false      # never kill a half-finished cold build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Until the integration token is set, skip rather than fail: a nightly red
      # cross would just be noise, and there is nothing to rebuild without it.
      - name: Check for token
        id: gate
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN is not set - skipping the rebuild."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build graph
        if: steps.gate.outputs.ready == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FULL_REBUILD: ${{ inputs.full || github.event.schedule == '40 13 * * 0' }}
        run: node build/build.js

      - name: Commit
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name  'atlas-map-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data cache
          # meta.json changes every run, so there is always a commit — which keeps the
          # repo "active" and stops GitHub auto-disabling the cron after 60 idle days.
          git diff --staged --quiet || git commit -m "map: rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
